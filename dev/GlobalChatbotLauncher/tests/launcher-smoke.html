<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Launcher smoke test</title>
<link rel="stylesheet" href="../../../assets/globalchatbotlauncher/styles/globalchatbotlauncher.css"></head><body>
<div hidden data-base3-global-chatbot-launcher
 data-ajax-url="/mock-global-chatbot" data-button-label="Open chat"
 data-close-label="Close" data-loading-label="Loading" data-load-error="Error"
 data-mode-overlay-label="Window" data-mode-modal-label="Dialog"
 data-mode-docked-label="Sidebar" data-mode-cover-label="Full window"
 data-mode-fullscreen-label="Fullscreen" data-mode-overlay-enabled="1"
 data-mode-modal-enabled="1" data-mode-docked-enabled="1" data-mode-cover-enabled="1"
 data-mode-fullscreen-enabled="1" data-resizable-overlay="1" data-reopen-overlay="1"
 data-config-group="test" data-config-name="global"></div>
<script>window.fetch=async()=>({ok:true,text:async()=>'<div id="mock-chat">Chat loaded</div><script type="module">document.body.dataset.chatModule="1";<\/script>'});</script>
<script type="module" src="../../../assets/globalchatbotlauncher/index.js"></script>
<script>
window.addEventListener('load',()=>setTimeout(()=>{
 const button=document.getElementById('base3-chatbot-fab');
 if(!button){document.body.dataset.test='launcher-missing';return;}
 button.click();
 setTimeout(()=>{
 const panel=document.getElementById('base3-chatbot-panel');
 const loaded=!!document.getElementById('mock-chat');
 const mode=panel.dataset.mode;
 document.body.dataset.test=loaded && mode==='overlay' && document.body.dataset.chatModule==='1'?'passed':'failed';
 },1500);
},200));
</script>
</body></html>
